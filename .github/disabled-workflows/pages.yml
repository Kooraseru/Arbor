name: Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - canary
    paths:
      - "content/assets/**"
      - "content/**"
      - "release-notes/**"
      - ".github/mkdocs.yml"
      - ".github/wiki-languages.yml"
      - ".github/scripts/construct-changelog.py"
      - ".github/scripts/configure-mkdocs-language.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  examples:
    name: Examples shape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check source example fixtures
        shell: bash
        run: |
          test -f src/examples/generated-type-facade/README.md
          test -f src/examples/plugin-sandbox/README.md
          test -f src/examples/plugin-sandbox/ServiceTypes.luau
          test -f src/examples/plugin-sandbox/setup-sandbox.server.luau
          test -f src/examples/serialized-types/IdentifyType.luau
          test -f src/examples/serialized-types/CheckRelations.luau

      - name: Reject forbidden example casts and aliases
        shell: bash
        run: |
          if grep -R --line-number --include='*.luau' --include='*.lua' -E '@game|@Shared|@Client|@Server|::[[:space:]]*any|require\(.+\)[[:space:]]*::[[:space:]]*any' src/examples; then
            echo "Found forbidden alias or high-risk any cast in examples."
            exit 1
          fi

      - name: Check example file shape
        shell: bash
        run: |
          if grep -R --line-number --include='*.luau' --include='*.lua' -- '--# Examples' src/examples; then
            echo "Examples should use normal file-shape headers, not --# Examples."
            exit 1
          fi

          missing_return=0
          while IFS= read -r file; do
            if ! grep -q -- '--# Return' "$file"; then
              echo "Missing --# Return in $file"
              missing_return=1
            fi
          done < <(find src/examples -type f \( -name '*.luau' -o -name '*.lua' \))

          exit "$missing_return"

  build:
    name: Build MkDocs sites
    needs: examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main
          path: main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material pyyaml

      - name: Build main docs
        if: hashFiles('main/.github/mkdocs.yml') != ''
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_site"
          cd main
          python .github/scripts/construct-changelog.py
          rm -rf content/locales/en/wiki/assets
          cp -R content/assets content/locales/en/wiki/assets

          mkdir -p .generated/shared
          cp .github/mkdocs.yml .generated/shared/mkdocs-en.yml
          python .github/scripts/configure-mkdocs-language.py --config .generated/shared/mkdocs-en.yml --language en --alternate-site-url https://kooraseru.github.io/Arbor/
          mkdocs build --config-file .generated/shared/mkdocs-en.yml --site-dir "$GITHUB_WORKSPACE/_site"

      - name: Checkout canary branch
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: canary
          path: canary

      - name: Configure canary docs
        if: hashFiles('canary/.github/mkdocs.yml') != ''
        shell: bash
        run: |
          cd canary
          python .github/scripts/construct-changelog.py
          rm -rf content/locales/en/wiki/assets
          cp -R content/assets content/locales/en/wiki/assets

          mkdir -p .generated/shared
          cp .github/mkdocs.yml .generated/shared/mkdocs-en.yml
          python .github/scripts/configure-mkdocs-language.py --config .generated/shared/mkdocs-en.yml --language en --site-name "Arbor Canary" --site-url https://kooraseru.github.io/Arbor/canary/ --alternate-site-url https://kooraseru.github.io/Arbor/canary/

      - name: Build canary docs
        if: hashFiles('canary/.github/mkdocs.yml') != ''
        shell: bash
        run: |
          cd canary
          mkdocs build --config-file .generated/shared/mkdocs-en.yml --site-dir "$GITHUB_WORKSPACE/_site/canary"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
