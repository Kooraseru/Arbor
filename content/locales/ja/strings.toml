line_1 = "---"
line_2 = "title: 関係型"
line_3 = "description: 子・祖先・子孫のチェックに使う型エイリアス。"
line_4 = "---"
line_6 = "# 関係型"
line_8 = "関係エイリアスは、アナライザーから見える instance type の間に、直下の子・祖先・子孫の関係があるかを答えます。"
line_10 = "これらのエイリアスは、Roblox の instance class としてアナライザーから公開される Luau の `Luau.extern|extern type` 値に対して動きます。"
line_12 = "## メンバー"
line_14 = "| メンバー | 戻り値 | 概要 |"
line_15 = "| --- | --- | --- |"
line_16 = "| [`ChildOf`](#childof) | `Child` または `never` | 親の直下の子である場合だけ、子の型を残す。 |"
line_17 = "| [`IsChildOf`](#ischildof) | `true` または `false` | 直下の子関係を boolean でチェックする。 |"
line_18 = "| [`AncestorOf`](#ancestorof) | `Ancestor` または `never` | 関係が成立する場合だけ祖先型を残す。 |"
line_19 = "| [`IsAncestorOf`](#isancestorof) | `true` または `false` | 祖先関係を boolean でチェックする。 |"
line_20 = "| [`DescendantOf`](#descendantof) | `Descendant` または `never` | 関係が成立する場合だけ子孫型を残す。 |"
line_21 = "| [`IsDescendantOf`](#isdescendantof) | `true` または `false` | 子孫関係を boolean でチェックする。 |"
