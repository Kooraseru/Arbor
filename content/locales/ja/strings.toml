line_177 = "| パラメーター | 説明 |"
line_178 = "| --- | --- |"
line_179 = "| `Descendant` | 子孫の候補となる、アナライザーから見える `Luau.extern|extern type`。 |"
line_180 = "| `Ancestor` | 祖先の候補となる、アナライザーから見える `Luau.extern|extern type`。 |"
line_182 = "### 戻り値"
line_184 = "| 型 | 条件 |"
line_185 = "| --- | --- |"
line_186 = "| `true` | `Descendant` が、アナライザーから見える `Ancestor` の子孫。 |"
line_187 = "| `false` | `Descendant` が、アナライザーから見える `Ancestor` の子孫ではない。 |"
line_189 = "### コード例"
line_200 = "## 境界"
line_202 = "| 境界 | 説明 |"
line_203 = "| --- | --- |"
line_204 = "| 直下の子チェック | 子孫までは検索しない。 |"
line_205 = "| 祖先・子孫チェック | アナライザーから見える直下の子 property をたどる。 |"
line_206 = "| 入力 | すべての関係入力は、アナライザーから見える `Luau.extern|extern type` 値である必要がある。 |"
line_207 = "| 関係が成立しない場合 | filter エイリアスは `never`、boolean エイリアスは `false` を返す。 |"
line_209 = "## 関連"
line_211 = "- [子の型](children.md)"
line_212 = "- [アナライザーモデル](../analyzer-model.md)"

[wiki.api.runtime]
line_1 = "---"
line_2 = "title: ランタイムメンバー"
line_3 = "description: Arbor が export するランタイム関数。"
line_4 = "---"
line_6 = "# ランタイムメンバー"
line_8 = "ランタイムメンバーは、実際の `Instance` の子を調べます。それだけでコンパイル時の型を作るものではありません。"
line_10 = "## メンバー"
line_12 = "| メンバー | 戻り値 | 概要 |"
line_13 = "| --- | --- | --- |"
line_14 = "| [`CollectChildren`](#collectchildren) | `{ [string]: Instance }` | 直下の子を、名前をキーにした table へ集める。 |"
line_15 = "| [`FindChild`](#findchild) | `Instance?` | 指定名の直下の子、または `nil` を返す。 |"
line_16 = "| [`ExpectChild`](#expectchild) | `Instance` | 指定名の直下の子を返し、なければエラーにする。 |"
line_18 = "## CollectChildren"
line_20 = "### 呼び出し形式"
line_22 = "<pre><code>Arbor.CollectChildren(parent: <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">Instance</a>): { [string]: <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">Instance</a> }</code></pre>"
line_24 = "直下の子を `Name` をキーにして返します。"
line_26 = "### パラメーター"
line_28 = "| パラメーター | 型 | 説明 |"
line_29 = "| --- | --- | --- |"
line_30 = "| `parent` | <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">`Instance`</a> | 直下の子を集める対象の instance。 |"
line_32 = "### 戻り値"
line_34 = "| 型 | 説明 |"
line_35 = "| --- | --- |"
line_36 = "| `{ [string]: `<a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">`Instance`</a>` }` | 直下の子名をキーにした table。 |"
line_38 = "### 動作"
line_40 = "| ルール | 説明 |"
line_41 = "| --- | --- |"
line_42 = "| 直下の子 | `parent:GetChildren()` を読み、子孫は無視する。 |"
line_43 = "| 安定した順序 | insert する前に、子を名前で sort する。 |"
line_44 = "| 重複名 | 直下の子 2 つが同じ名前ならエラーにする。 |"
line_46 = "### コード例"
line_53 = "## FindChild"
line_55 = "### 呼び出し形式"
line_57 = "<pre><code>Arbor.FindChild(parent: <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">Instance</a>, name: string): <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">Instance</a>?</code></pre>"
line_59 = "指定した名前の直下の子を返します。なければ `nil` を返します。"
line_61 = "### パラメーター"
line_63 = "| パラメーター | 型 | 説明 |"
line_64 = "| --- | --- | --- |"
line_65 = "| `parent` | <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">`Instance`</a> | 検索する instance。 |"
line_66 = "| `name` | `string` | 探す直下の子名。 |"
line_68 = "### 戻り値"
line_70 = "| 型 | 説明 |"
line_71 = "| --- | --- |"
line_72 = "| <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">`Instance`</a>`?` | 一致する子があれば、その instance。 |"
line_74 = "### コード例"
line_80 = "## ExpectChild"
line_82 = "### 呼び出し形式"
line_84 = "<pre><code>Arbor.ExpectChild(parent: <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">Instance</a>, name: string): <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">Instance</a></code></pre>"
line_86 = "指定した名前の直下の子を返します。なければエラーにします。"
line_88 = "### パラメーター"
line_90 = "| パラメーター | 型 | 説明 |"
line_91 = "| --- | --- | --- |"
line_92 = "| `parent` | <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">`Instance`</a> | 検索する instance。 |"
line_93 = "| `name` | `string` | 必須として探す直下の子名。 |"
line_95 = "### 戻り値"
line_97 = "| 型 | 説明 |"
line_98 = "| --- | --- |"
line_99 = "| <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">`Instance`</a> | 一致する子 instance。 |"
line_101 = "### エラー"
line_103 = "| 条件 | 内容 |"
line_104 = "| --- | --- |"
line_105 = "| 子がない | 子が見つからないとき、エラーにする。 |"
line_107 = "### コード例"
line_113 = "## 関連"
line_115 = "- [子の型](children.md)"
line_116 = "- [ランタイムローダー](runtime-loaders/index.md)"

[wiki.api.runtime_loaders_load_module_map]
line_1 = "---"
line_2 = "title: LoadModuleMap.From"
line_3 = "---"
line_5 = "# LoadModuleMap.From"
line_7 = "直下の `ModuleScript` を読みこみ、それぞれの `require` 結果を検証します。"
line_9 = "## 呼び出し形式"
line_11 = "<pre><code>Arbor.RuntimeLoaders.LoadModuleMap.From&lt;T&gt;("
line_12 = "    root: <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">Instance</a>,"
line_13 = "    validate: ModuleValidator&lt;T&gt;"
line_14 = "): { [string]: T }</code></pre>"
line_16 = "ルートエイリアス:"
line_18 = "<pre><code>Arbor.LoadModules&lt;T&gt;("
line_19 = "    root: <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">Instance</a>,"
line_20 = "    validate: ModuleValidator&lt;T&gt;"
line_21 = "): { [string]: T }</code></pre>"
line_23 = "バリデーター型:"
line_29 = "## パラメーター"
line_31 = "| パラメーター | 型 | 説明 |"
line_32 = "| --- | --- | --- |"
line_33 = "| `root` | <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - データモデル内のオブジェクトに使われる Roblox の基本クラス。\">`Instance`</a> | 直下の `ModuleScript` を読みこむ対象の instance。 |"
line_34 = "| `validate` | `ModuleValidator<T>` | 生の `require` 結果を `unknown` として受け取り、受け入れた型つきの値を返す。 |"
line_36 = "## 戻り値"
line_38 = "| 型 | 説明 |"
line_39 = "| --- | --- |"
line_40 = "| `{ [string]: T }` | 直下の `ModuleScript.Name` をキーにした map。 |"
line_42 = "## 動作"
line_44 = "| ルール | 説明 |"
line_45 = "| --- | --- |"
line_46 = "| 直下の子 | `GetChildren()` で直下の子を読む。 |"
line_47 = "| 順序 | 子を名前で sort する。 |"
line_48 = "| しぼりこみ | `ModuleScript` ではない子を飛ばす。 |"
line_49 = "| 重複名 | 同じ `ModuleScript` 名があればエラーにする。 |"
line_50 = "| Require failure | `require` の失敗を module path つきで包む。 |"
line_51 = "| Validator failure | バリデーターの失敗を module path つきで包む。 |"
line_53 = "## コード例"
line_61 = "## 組み合わせ"
line_63 = "アナライザーから正確な子が見えていて、呼び出し境界でより厳密な table type が必要なら、`Arbor.ChildRecord<Root, T>` を使います。"
line_65 = "## よくある間違い"
line_67 = "- `unknown` を検証せず、`require` 結果を cast する。"
line_68 = "- 子孫まで再帰的に読みこむと考える。"
line_69 = "- registry や lifecycle system へ育てる。"
line_71 = "## 関連"
line_73 = "- [ランタイムローダー](index.md)"
line_74 = "- [子の型](../children.md)"
line_75 = "- [ランタイムの読みこみ](index.md)"
