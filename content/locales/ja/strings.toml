[wiki.api.children]
line_1 = "---"
line_2 = "title: 子の型"
line_3 = "description: アナライザーから見える直下の子に使う型エイリアス。"
line_4 = "---"
line_6 = "# 子の型"
line_8 = "子の型エイリアスは、親の型から、アナライザーに見えている直下の子 property を読みます。"
line_10 = "対象は型であり、ランタイムの instance ではありません。Luau の型関数では、Roblox の instance class は `Luau.extern|extern type` の値として見えます。アナライザーがその子を型上の直下 property として見えていない場合、Arbor があとから名前を取りもどすことはできません。"
line_12 = "## メンバー"
line_14 = "| メンバー | 戻り値 | 概要 |"
line_15 = "| --- | --- | --- |"
line_16 = "| [`Child`](#child) | child instance type、`nil`、または `never` | lookup mode を明示して、名前から直下の子 1 つを解決する。 |"
line_17 = "| [`RequiredChild`](#requiredchild) | child instance type | 名前から必須の直下の子 1 つを解決する。 |"
line_18 = "| [`ChildNames`](#childnames) | string singleton union | アナライザーから見える直下の子名を返す。 |"
line_19 = "| [`ChildNamesOfClass`](#childnamesofclass) | string singleton union | 指定クラスに一致する直下の子名を返す。 |"
line_20 = "| [`ChildRecord`](#childrecord) | table type | 指定した value type で、子名を正確なキーにした record を作る。 |"
line_21 = "| [`ChildTypeRecord`](#childtyperecord) | table type | 子 instance type で、子名を正確なキーにした record を作る。 |"
line_22 = "| [`ChildrenOfClass`](#childrenofclass) | table type | 指定クラスに一致する子について、子名を正確なキーにした record を作る。 |"
line_24 = "## Child"
line_26 = "### 呼び出し形式"
line_32 = "名前から直下の子 1 つを解決します。"
line_34 = "### 型パラメーター"
line_36 = "| パラメーター | 説明 |"
line_37 = "| --- | --- |"
line_38 = "| `Parent` | アナライザーから見える Roblox の `Luau.extern|extern type`。 |"
line_39 = "| `Name` | 子名を表す string singleton。 |"
line_40 = "| `Mode` | 任意の lookup mode。default は `\"checked\"`。 |"
line_42 = "### 戻り値"
line_44 = "| 型 | 条件 |"
line_45 = "| --- | --- |"
line_46 = "| `typeof(parent.Child)` | 指定名の子がある。 |"
line_47 = "| `nil` | `Mode` が `\"optional\"` で、子がない。 |"
line_48 = "| `never` | `Mode` が `\"checked\"` で、子がない。 |"
line_50 = "### エラー"
line_52 = "| Mode | 条件 |"
line_53 = "| --- | --- |"
line_54 = "| `\"required\"` | 子がないとき、アナライザーエラーを出す。 |"
line_56 = "### コード例"
line_66 = "## RequiredChild"
line_68 = "### 呼び出し形式"
line_74 = "`Arbor.Child<{ Parent: Parent, Name: Name, Mode: \"required\" }>` の短い書き方です。"
line_76 = "### 型パラメーター"
line_78 = "| パラメーター | 説明 |"
line_79 = "| --- | --- |"
line_80 = "| `Parent` | アナライザーから見える Roblox の `Luau.extern|extern type`。 |"
line_81 = "| `Name` | 子名を表す string singleton。 |"
line_83 = "### 戻り値"
line_85 = "| 型 | 条件 |"
line_86 = "| --- | --- |"
line_87 = "| `typeof(parent.Child)` | 指定名の子がある。 |"
line_88 = "| analyzer error | 指定名の子がない。 |"
line_90 = "### コード例"
line_99 = "## ChildNames"
line_101 = "### 呼び出し形式"
line_107 = "アナライザーから見える直下の子名の union を返します。"
line_109 = "### 戻り値"
line_111 = "| 型 | 条件 |"
line_112 = "| --- | --- |"
line_113 = "| `\"ChildA\" | \"ChildB\" | ...` | 直下の子名がアナライザーから見える。 |"
line_114 = "| `never` | 直下の子名が 1 つも見えない。 |"
line_116 = "### コード例"
line_122 = "## ChildNamesOfClass"
line_124 = "### 呼び出し形式"
line_130 = "アナライザーから見える型が `ClassType` に一致するか、そこから継承している直下の子名を union で返します。"
line_132 = "### 型パラメーター"
line_134 = "| パラメーター | 説明 |"
line_135 = "| --- | --- |"
line_136 = "| `Parent` | アナライザーから見える Roblox の `Luau.extern|extern type`。 |"
line_137 = "| `ClassType` | `ModuleScript` など、filter に使う Roblox class の `Luau.extern|extern type`。 |"
line_139 = "### 戻り値"
line_141 = "| 型 | 条件 |"
line_142 = "| --- | --- |"
line_143 = "| `\"ChildA\" | \"ChildB\" | ...` | 一致する直下の子が見える。 |"
line_144 = "| `never` | 一致する直下の子が 1 つも見えない。 |"
line_146 = "## ChildRecord"
line_148 = "### 呼び出し形式"
line_154 = "直下の子名をキーにし、それぞれの値を `Value` にした table type を作ります。"
line_156 = "### 型パラメーター"
line_158 = "| パラメーター | 説明 |"
line_159 = "| --- | --- |"
line_160 = "| `Parent` | アナライザーから見える Roblox の `Luau.extern|extern type`。 |"
line_161 = "| `Value` | すべての直下の子 key に入れる value type。 |"
line_163 = "### 戻り値"
line_165 = "| 型 | 説明 |"
line_166 = "| --- | --- |"
line_167 = "| `{ [ChildName]: Value }` | アナライザーから見える直下の子名をキーにした table type。 |"
line_169 = "### コード例"
line_178 = "## ChildTypeRecord"
line_180 = "### 呼び出し形式"
line_186 = "直下の子名をキーにし、それぞれの値をアナライザーから見える子 instance type にした table type を作ります。"
line_188 = "### 型パラメーター"
line_190 = "| パラメーター | 説明 |"
line_191 = "| --- | --- |"
line_192 = "| `Parent` | アナライザーから見える Roblox の `Luau.extern|extern type`。 |"
line_194 = "### 戻り値"
line_196 = "| 型 | 説明 |"
line_197 = "| --- | --- |"
line_198 = "| `{ [ChildName]: typeof(parent.Child) }` | アナライザーから見える直下の子名をキーにし、各 value をその子の instance type にした table type。 |"
line_200 = "## ChildrenOfClass"
line_202 = "### 呼び出し形式"
line_208 = "アナライザーから見える型が `ClassType` に一致するか、そこから継承している直下の子について table type を作ります。value は一致した子の instance type です。"
line_210 = "### 型パラメーター"
line_212 = "| パラメーター | 説明 |"
line_213 = "| --- | --- |"
line_214 = "| `Parent` | アナライザーから見える Roblox の `Luau.extern|extern type`。 |"
line_215 = "| `ClassType` | `ModuleScript` など、filter に使う Roblox class の `Luau.extern|extern type`。 |"
line_217 = "### 戻り値"
line_219 = "| 型 | 条件 |"
line_220 = "| --- | --- |"
line_221 = "| `{ [ChildName]: typeof(parent.Child) }` | 一致する直下の子が見える。 |"
line_222 = "| `{}` | 一致する直下の子が 1 つも見えない。 |"
line_224 = "## 境界"
line_226 = "| 境界 | 説明 |"
line_227 = "| --- | --- |"
line_228 = "| 直下の子 | これらのエイリアスは子孫を検索しない。 |"
line_229 = "| Extern input | `Parent` は、Roblox の `Luau.extern|extern type` としてアナライザーから見えている必要がある。 |"
line_230 = "| Synthetic parent | synthetic な `Parent` property は、子名と child record の helper から除外される。 |"
line_231 = "| Module return | 子 instance type は `require` の戻り値型ではない。 |"
line_233 = "## 関連"
line_235 = "- [アナライザーモデル](../analyzer-model.md)"
line_236 = "- [関係型](relations.md)"
line_237 = "- [ランタイムメンバー](runtime.md)"

[wiki.api.definitions]
line_1 = "---"
line_2 = "title: Definition Runtime"
line_3 = "description: Arbor の型関数 definition layer を分割するためのメモ。"
line_4 = "---"
line_6 = "# Definition Runtime"
line_8 = "`Mold`、`Run`、`Resolve1`、`Resolve2` は、Arbor の生成ファサードが使う低レベルの公開エイリアスです。"
line_10 = "多くの利用側コードでは、`ChildNames`、`RequiredChild`、`ChildrenOfClass`、`IsDescendantOf` などの名前つきエイリアスを優先してください。"
line_12 = "## メンバー"
line_14 = "| メンバー | 戻り値 | 概要 |"
line_15 = "| --- | --- | --- |"
line_16 = "| [`Mold`](#mold) | Mold 済み definition 型 | definition schema の最初の 2 つの generic parameter を差し替える。 |"
line_17 = "| [`Run`](#run) | 解決後の型 | Mold 済みの Arbor definition を解決する。 |"
line_18 = "| [`Resolve1`](#resolve1) | 解決後の型 | 1 つの型引数で definition を解決する。 |"
line_19 = "| [`Resolve2`](#resolve2) | 解決後の型 | 2 つの型引数で definition を解決する。 |"
line_21 = "## Mold"
line_23 = "### 呼び出し形式"
line_29 = "definition schema の最初の 2 つの generic parameter を差し替えます。"
line_31 = "### 型パラメーター"
line_33 = "| パラメーター | 説明 |"
line_34 = "| --- | --- |"
line_35 = "| `Schema` | 型関数の definition schema。 |"
line_36 = "| `First` | 最初の generic parameter に入れる型。 |"
line_37 = "| `Second` | 2 つ目の generic parameter に入れる型。 |"
line_39 = "### 戻り値"
line_41 = "| 型 | 説明 |"
line_42 = "| --- | --- |"
line_43 = "| Mold 済み definition 型 | Arbor の最初と 2 つ目の型引数を差し替えた definition schema。 |"
line_45 = "## Run"
line_47 = "### 呼び出し形式"
line_53 = "Mold 済みの Arbor definition を最終型へ解決します。"
line_55 = "### 型パラメーター"
line_57 = "| パラメーター | 説明 |"
line_58 = "| --- | --- |"
line_59 = "| `Molded` | Mold 済みの Arbor definition table。 |"
line_61 = "### 戻り値"
line_63 = "| 型 | 説明 |"
line_64 = "| --- | --- |"
line_65 = "| 解決後の型 | Mold 済みの Arbor definition が作る最終型。 |"
line_67 = "## Resolve1"
line_69 = "### 呼び出し形式"
line_75 = "1 つの型引数で definition を Mold し、解決します。"
line_77 = "### 型パラメーター"
line_79 = "| パラメーター | 説明 |"
line_80 = "| --- | --- |"
line_81 = "| `Definition` | 型関数 definition。 |"
line_82 = "| `First` | 最初の型引数。 |"
line_84 = "### 戻り値"
line_86 = "| 型 | 説明 |"
line_87 = "| --- | --- |"
line_88 = "| 解決後の型 | `Definition` に `First` を入れて Mold と Run をした最終型。 |"
line_90 = "## Resolve2"
line_92 = "### 呼び出し形式"
line_98 = "2 つの型引数で definition を Mold し、解決します。"
line_100 = "### 型パラメーター"
line_102 = "| パラメーター | 説明 |"
line_103 = "| --- | --- |"
line_104 = "| `Definition` | 型関数 definition。 |"
line_105 = "| `First` | 最初の型引数。 |"
line_106 = "| `Second` | 2 つ目の型引数。 |"
line_108 = "### 戻り値"
line_110 = "| 型 | 説明 |"
line_111 = "| --- | --- |"
line_112 = "| 解決後の型 | `Definition` に `First` と `Second` を入れて Mold と Run をした最終型。 |"
line_114 = "## 分割境界"
line_116 = "API リファレンスを source folder ごとではなく公開メンバーのグループごとに分ける主な理由が、この layer です。"
line_118 = "`Definitions/` の内部 tag、projection、関係チェック、source が増えても、すべての実装ファイルを利用側 API page にする必要はありません。下位ファイルを意図した extension point にしない限り、公開ドキュメントはルートファサードに合わせてください。"
line_120 = "## 関連"
line_122 = "- [API リファレンス](index.md)"
line_123 = "- [子の型](children.md)"
line_124 = "- [関係型](relations.md)"

