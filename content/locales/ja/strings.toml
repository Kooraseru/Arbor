[wiki.faq]
title = "FAQ"

[wiki.faq.compile_time_modules]
question = "Arbor はコンパイル時にモジュールを読み込みますか？"
answer = "いいえ。Arbor の型関数は、アナライザーから見えるインスタンス情報を調べます。"

[wiki.faq.childnames_module_returns]
question = "ChildNames は ModuleScript の戻り値型を保証しますか？"
answer = "いいえ。保証するのは直下の子名です。ModuleScript の戻り値はランタイムで検証してください。"

[wiki.faq.init_facade]
question = "なぜ init.luau ファサードがあるのですか？"
answer_intro = "ファサードは安定した公開 API です。"
answer_outro = "実装を目的ごとのフォルダーへ分けても、利用側が source layout を追いかけずにすみます。"

[wiki.faq.direct_requires]
question = "Definitions や RuntimeLoaders の下を直接 require するべきですか？"
answer_intro = "API リファレンスで下位メンバーが公開と書かれていない限り、ルートファサードを使ってください。"
answer_outro = "実装フォルダーを直接 `require` すると、利用側コードが Arbor 内部の分け方に依存します。まさに避けたい依存です。"

[wiki.faq.runtime_functions]
question = "ほぼコンパイル時のパッケージなのに、なぜランタイム関数がありますか？"
answer_intro = "ランタイム関数があるのは、Roblox から実際の `Instance` の子や動的な `require` 結果を受け取る境界だけです。"
answer_outro = "意図して小さくしています。registry、boot system、package discovery framework ではありません。"

