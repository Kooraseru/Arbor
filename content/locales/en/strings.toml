[wiki.faq]
title = "FAQ"

[wiki.faq.compile_time_modules]
question = "Does Arbor load modules at compile time?"
answer = "No. Arbor's type functions inspect analyzer-visible instance metadata."

[wiki.faq.childnames_module_returns]
question = "Does ChildNames prove ModuleScript return types?"
answer = "No. It proves direct child names. Validate ModuleScript return values at runtime."

[wiki.faq.init_facade]
question = "Why is there an init.luau facade?"
answer_intro = "The facade is the stable public surface:"
answer_outro = "The implementation can split into focused folders without making consumers chase source layout."

[wiki.faq.direct_requires]
question = "Should I require files under Definitions or RuntimeLoaders directly?"
answer_intro = "Prefer the root facade unless the API reference documents a lower-level member as public."
answer_outro = "Direct requires into implementation folders make consumer code care about Arbor's internal split, which is exactly the dependency we do not want."

[wiki.faq.runtime_functions]
question = "Why does Arbor have runtime functions if it is mostly compile-time?"
answer_intro = "Runtime functions exist only at the boundary where Roblox gives you actual `Instance` children or dynamic `require` results."
answer_outro = "They are deliberately small. They are not registries, boot systems, or package discovery frameworks."

