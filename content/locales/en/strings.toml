line_5 = "# LoadModuleMap.From"
line_7 = "Loads direct `ModuleScript` children and validates each required value."
line_9 = "## Call Structure"
line_11 = "<pre><code>Arbor.RuntimeLoaders.LoadModuleMap.From&lt;T&gt;("
line_12 = "    root: <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - Roblox base class for objects in the data model.\">Instance</a>,"
line_13 = "    validate: ModuleValidator&lt;T&gt;"
line_14 = "): { [string]: T }</code></pre>"
line_16 = "Root alias:"
line_18 = "<pre><code>Arbor.LoadModules&lt;T&gt;("
line_19 = "    root: <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - Roblox base class for objects in the data model.\">Instance</a>,"
line_20 = "    validate: ModuleValidator&lt;T&gt;"
line_21 = "): { [string]: T }</code></pre>"
line_23 = "Validator type:"
line_29 = "## Parameters"
line_31 = "| Parameter | Type | Description |"
line_32 = "| --- | --- | --- |"
line_33 = "| `root` | <a class=\"arbor-type-link\" href=\"https://create.roblox.com/docs/reference/engine/classes/Instance\" data-tooltip=\"Instance - Roblox base class for objects in the data model.\">`Instance`</a> | The instance whose direct `ModuleScript` children should be loaded. |"
line_34 = "| `validate` | `ModuleValidator<T>` | Receives the raw `require` result as `unknown` and returns the accepted typed value. |"
line_36 = "## Returns"
line_38 = "| Type | Description |"
line_39 = "| --- | --- |"
line_40 = "| `{ [string]: T }` | A map keyed by direct `ModuleScript.Name`. |"
line_42 = "## Behavior"
line_44 = "| Rule | Description |"
line_45 = "| --- | --- |"
line_46 = "| Direct children | Reads direct children with `GetChildren()`. |"
line_47 = "| Ordering | Sorts children by name. |"
line_48 = "| Filtering | Skips non-`ModuleScript` children. |"
line_49 = "| Duplicate names | Errors on duplicate `ModuleScript` names. |"
line_50 = "| Require failures | Wraps `require` failures with the module path. |"
line_51 = "| Validator failures | Wraps validator failures with the module path. |"
line_53 = "## Code Samples"
line_61 = "## Pairing"
line_63 = "Use `Arbor.ChildRecord<Root, T>` when the analyzer can see the exact children and you want a stricter table type at the call boundary."
line_65 = "## Common Mistakes"
line_67 = "- Casting `require` results instead of validating `unknown`."
line_68 = "- Expecting recursive descendant loading."
line_69 = "- Letting this become a registry or lifecycle system."
