line_6 = "# Child Types"
line_8 = "Child type aliases read analyzer-visible direct child properties from a parent type."
line_10 = "They operate on types, not runtime instances. In Luau type functions, Roblox instance classes appear as `Luau.extern|extern type` values. If the analyzer cannot see the child as a direct property on that type, Arbor cannot recover that name later."
line_12 = "## Members"
line_14 = "| Member | Returns | Summary |"
line_15 = "| --- | --- | --- |"
line_16 = "| [`Child`](#child) | child instance type, `nil`, or `never` | Resolve one direct child by name with explicit lookup mode. |"
line_17 = "| [`RequiredChild`](#requiredchild) | child instance type | Require one direct child by name. |"
line_18 = "| [`ChildNames`](#childnames) | string singleton union | Return analyzer-visible direct child names. |"
line_19 = "| [`ChildNamesOfClass`](#childnamesofclass) | string singleton union | Return direct child names matching a class. |"
line_20 = "| [`ChildRecord`](#childrecord) | table type | Build exact child-keyed records with a chosen value type. |"
line_21 = "| [`ChildTypeRecord`](#childtyperecord) | table type | Build exact child-keyed records with child instance types. |"
line_22 = "| [`ChildrenOfClass`](#childrenofclass) | table type | Build exact child-keyed records for children matching a class. |"
