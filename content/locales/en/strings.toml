line_114 = "## Split Boundary"
line_116 = "This layer is the main reason the API reference is split by public member group instead of by source folder."
line_118 = "`Definitions/` can grow internal tags, projections, relationship checks, or sources without forcing every implementation file to become a user-facing API page. Public docs should follow the root facade unless a lower-level file becomes an intentional extension point."
