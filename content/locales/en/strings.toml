line_6 = "# Relation Types"
line_8 = "Relation aliases answer whether analyzer-visible instance types have a direct-child, ancestor, or descendant relationship."
line_10 = "These aliases operate on Luau `Luau.extern|extern type` values exposed by the analyzer for Roblox instance classes."
line_12 = "## Members"
line_14 = "| Member | Returns | Summary |"
line_15 = "| --- | --- | --- |"
line_16 = "| [`ChildOf`](#childof) | `Child` or `never` | Keep a child type only when it is a direct child of a parent. |"
line_17 = "| [`IsChildOf`](#ischildof) | `true` or `false` | Boolean direct-child relation check. |"
line_18 = "| [`AncestorOf`](#ancestorof) | `Ancestor` or `never` | Keep an ancestor type only when the relation passes. |"
line_19 = "| [`IsAncestorOf`](#isancestorof) | `true` or `false` | Boolean ancestor relation check. |"
line_20 = "| [`DescendantOf`](#descendantof) | `Descendant` or `never` | Keep a descendant type only when the relation passes. |"
line_21 = "| [`IsDescendantOf`](#isdescendantof) | `true` or `false` | Boolean descendant relation check. |"
