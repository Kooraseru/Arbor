metadata_heading = "Metadata"
localization = "The release-note and changelog generators combine this metadata with the selected locale. The root GitHub release body uses whichever locale is marked `default = true`."

[wiki.core_concepts.design_goals]
title = "Design Goals"
intro = "Arbor is intentionally small."
goals_heading = "Goals"
goal_hierarchy = "expose Roblox instance hierarchy shape to Luau's type system"
goal_facade = "keep the public facade stable while internals split into focused source folders"
goal_inspectable = "keep package source easy to inspect"
goal_child_names = "avoid second sources of truth for child names"
goal_runtime_loading = "preserve dynamic runtime loading when validation is explicit"
goal_focused = "keep helper APIs focused enough to explain in one page each"
non_goals_heading = "Non-Goals"
non_goals_outro = "If a feature needs one of those responsibilities, it probably belongs in another package or an adapter around Arbor."

